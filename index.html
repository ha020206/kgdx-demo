<!DOCTYPE html>
<!-- 판정 시연(I-LDEL 오개념 T14 → 오개념). tools/build_demo_html.py로 만든 파일이다. 직접 고치지 말고 스크립트를 다시 돌린다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판정 시연 · I-LDEL 오개념</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
:root {
  --ink: #111;
  --muted: #8a8a8a;
  --line: #ececec;
  --accent: #2f80ed;
  --pick: #fff6e0;
  --hat: #7ac143;
  --var: #d26ad2;
  --ctrl: #f0a033;
  --fn: #6b5ce7;
  --ok: #15803d;
  --ld: #b45309;
  --mc: #b91c1c;
  --pd: #1d4ed8;
  --hold: #4b5563;
}
* { box-sizing: border-box; }
html, body { background: #fff; }
body {
  margin: 0;
  color: var(--ink);
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  letter-spacing: -0.02em;
}
.top {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  padding: 12px 24px 0;
}
body.on-quiz h1 { display: none; }
body.on-quiz .top { padding-bottom: 0; }
.top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { margin: 4px 0 0; font-size: 20px; font-weight: 700; }
main { max-width: 980px; margin: 0 auto; padding: 4px 24px 28px; }
.note { color: #777; font-size: 14px; }
.sessions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 16px; }
@media (max-width: 700px) { .sessions { grid-template-columns: 1fr; } }
.session-btn {
  text-align: left; width: 100%; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 16px; cursor: pointer; font: inherit;
}
.session-btn:hover { border-color: var(--accent); }
.session-btn strong { display: block; font-size: 17px; }
.session-btn span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.bar {
  display: flex; justify-content: space-between; align-items: baseline;
  color: #9a9a9a; font-size: 13px; margin: 0 0 10px;
}

#stem {
  margin: 0 0 14px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.35;
}

.quiz-grid {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.1fr);
  gap: 12px 28px;
  align-items: start;
}
.quiz-grid.single { grid-template-columns: 1fr; }
@media (max-width: 800px) { .quiz-grid { grid-template-columns: 1fr; gap: 12px; } }
.ask-col { min-width: 0; }

.blocks { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.blk {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 16px;
  white-space: nowrap;
  line-height: 1.2;
}
.blk.hat { background: var(--hat); padding-left: 10px; }
.blk.hat::before {
  content: "";
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent #fff;
}
.blk.var { background: var(--var); }
.blk.ctrl { background: var(--ctrl); }
.blk.fn { background: var(--fn); }
.blk.decl { background: #e67e22; }
.blk.cmd { background: #888; }
.chip {
  display: inline-flex;
  align-items: center;
  background: #fff;
  color: #333;
  border-radius: 7px;
  padding: 1px 6px;
  font-weight: 600;
  font-size: 12px;
}
.chip.dd::after {
  content: "";
  margin-left: 4px;
  border: 3px solid transparent;
  border-top-color: #777;
  border-bottom-width: 0;
}

h2 { margin: 0 0 10px; font-size: 18px; font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; }
.opts { display: flex; flex-direction: column; gap: 4px; }
label.opt {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 6px 10px;
  border: 1px solid #f0f0f0;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  background: #fff;
  min-height: 36px;
}
label.opt:hover { background: #fafafa; }
label.opt:has(input:checked) {
  background: var(--pick);
  border-color: #f3d48a;
}
div.opt {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 6px 10px;
  border: 1px solid #f0f0f0;
  border-radius: 10px;
  font-size: 15px;
  background: #fff;
  min-height: 36px;
}
div.opt.code { align-items: flex-start; padding-top: 6px; padding-bottom: 6px; }
div.opt.right { background: #e8f7ee; border-color: #7dca98; }
div.opt.wrong { background: #fde8e8; border-color: #e38a8a; }
label.opt.code, div.opt.code { align-items: flex-start; padding-top: 6px; padding-bottom: 6px; }
label.opt.code .blocks, div.opt.code .blocks { gap: 3px; }
label.opt.code .blk, div.opt.code .blk { font-size: 12px; padding: 3px 8px; }
label.opt input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; flex: 0 0 auto; }
.opt-text { flex: 1; min-width: 0; }
.opt-num { font-weight: 700; flex: 0 0 auto; }
.opt-blocks { flex: 1; min-width: 0; }
.dev-tag {
  margin-left: auto;
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 600;
  color: #8a8a8a;
  border: 1px solid #e5e5e5;
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.dev-tag.C { color: #2563eb; border-color: #bfdbfe; }
.dev-tag.T, .dev-tag.O { color: #b45309; border-color: #f3d48a; background: #fff8e8; }
.dev-tag.D, .dev-tag.X { color: #9aa; }
body:not(.dev) .dev-tag { display: none; }
body.on-play .dev-tag { display: inline-block; }

.conf-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 0;
  color: #555;
  font-size: 14px;
}
.conf-line > span { font-weight: 700; }
.conf { display: flex; flex-wrap: wrap; gap: 4px 2px; }
label.conf-opt {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  background: transparent;
  color: #555;
}
label.conf-opt + label.conf-opt::before {
  content: "·";
  color: #bbb;
  margin-right: 4px;
}
label.conf-opt:has(input:checked) { color: var(--ink); font-weight: 700; }
label.conf-opt input { accent-color: var(--accent); }
.play-quiz .conf-line {
  margin-top: 14px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.play-quiz label.conf-opt.picked,
.play-quiz label.conf-opt:has(input:checked) {
  background: var(--pick);
  box-shadow: 0 0 0 1px var(--accent);
}
#other-wrap { margin-top: 6px; }
#other, #reason {
  width: 100%;
  border: 0;
  border-bottom: 1px solid #ddd;
  padding: 6px 0;
  font: inherit;
  outline: none;
}
#reason-wrap { margin-top: 8px; }
#other:focus, #reason:focus { border-bottom-color: var(--accent); }
.privacy { margin: 4px 0 0; color: #aaa; font-size: 12px; }
.value-table { margin-top: 8px; }
.value-table table { border-collapse: collapse; width: 100%; font-size: 14px; }
.value-table th, .value-table td { border: 1px solid var(--line); padding: 6px 8px; }
.nav { display: flex; justify-content: space-between; margin: 18px 0 0; }
button { font: inherit; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
.primary { background: var(--accent); color: #fff; border: 0; }
.ghost { background: #fff; border: 1px solid #ddd; color: #444; }
button:disabled { opacity: 0.35; cursor: not-allowed; }
.dev-toggle { color: #999; font-size: 12px; }
body:not(.dev) .llm-dot,
body:not(.dev) #open-graph,
body:not(.dev) #open-cases,
body:not(.dev) #open-demo,
body:not(.dev) .graph-ev,
body:not(.dev) .hold-why,
body:not(.dev) .debug { display: none !important; }
.llm-dot { font-size: 12px; color: #999; }
.llm-dot.on { color: var(--ok); }
.llm-dot.off { color: #b45309; }
.wait-msg { font-size: 22px; font-weight: 700; margin: 64px 0 8px; }

.rev {
  padding: 16px 0 18px;
  border-bottom: 1px solid #f0f0f0;
}
.rev:last-child { border-bottom: 0; }
.rev .no { margin: 0 0 4px; color: #999; font-size: 12px; font-weight: 700; }
.rev h3 { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
.rev dl { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; margin: 0 0 10px; }
.rev dt { color: #888; font-size: 13px; }
.rev dd { margin: 0; font-size: 15px; }
.rev .ok { color: var(--ok); font-weight: 600; }
.rev .bad { color: var(--mc); font-weight: 600; }
.rev .explain {
  margin: 10px 0 0;
  padding: 10px 12px;
  background: #f7f8fa;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.45;
}
.rev .server-line {
  margin: 6px 0 0;
  color: #555;
  font-size: 13px;
  font-weight: 600;
}
.rev .review-conf { margin: 8px 0 0; }
.rev .review-conf label.conf-opt { cursor: default; }
.rev .hold-why {
  margin: 8px 0 0;
  padding: 8px 10px;
  border-left: 3px solid #f59e0b;
  background: #fffbeb;
  color: #444;
  font-size: 13px;
  line-height: 1.45;
}
.rev .hold-why b { margin-right: 6px; color: #b45309; }
.rev .guide {
  margin: 8px 0 0;
  padding: 8px 12px;
  border-left: 3px solid var(--ok);
  background: #fbfcfd;
  border-radius: 6px;
}
.rev .guide .g-h { margin: 0; color: #333; font-size: 13px; font-weight: 700; }
.rev .guide .g-h small { color: #888; font-weight: 400; }
.rev .guide .explain { margin: 6px 0 4px; background: transparent; padding: 0; }
.rev .guide .book-meta { margin: 0; color: #666; font-size: 12px; }
.rev .graph-ev {
  margin: 8px 0 0;
  padding: 8px 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #555;
  font-size: 13px;
  line-height: 1.45;
}
.rev .graph-ev .g-h {
  margin: 0 0 4px;
  color: #333;
  font-size: 12px;
  font-weight: 700;
}
.rev .graph-ev p { margin: 0; }
.rev .g-meta {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 4px 10px;
  margin: 0 0 8px;
}
.rev .g-meta > div { display: contents; }
.rev .g-meta dt { color: #888; font-size: 12px; }
.rev .g-meta dd { margin: 0; font-size: 13px; }
.rev .book {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.rev .book-meta { color: #555; font-size: 13px; }
.rev .book blockquote {
  margin: 6px 0 0;
  padding: 0 0 0 10px;
  border-left: 3px solid #ddd;
  color: #444;
  font-size: 13px;
}
.rev .book-foot {
  margin: 8px 0 0;
  color: #999;
  font-size: 11px;
}
.cases-layout {
  display: grid;
  grid-template-columns: minmax(240px, 300px) 1fr;
  gap: 16px;
  align-items: start;
}
.case-groups {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.case-tab {
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  font-size: 12px;
  cursor: pointer;
}
.case-tab.on { border-color: #333; background: #f7f8fa; font-weight: 700; }
.cases-pick {
  max-height: 70vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.case-btn {
  text-align: left;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
}
.case-btn.on { border-color: #333; background: #f7f8fa; }
.case-btn strong { display: block; font-size: 13px; }
.case-btn span { display: block; color: #777; font-size: 12px; margin-top: 2px; }
.case-btn.bad { border-color: #c45; }
.flow h3 { margin: 0 0 10px; font-size: 17px; }
.flow .no { margin: 0 0 4px; color: #999; font-size: 12px; font-weight: 700; }
.flow-tracks { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.flow-steps {
  list-style: none;
  margin: 0;
  padding: 0;
}
.flow-steps li {
  position: relative;
  margin: 0;
  padding: 10px 12px 10px 28px;
  border-left: 2px solid #eee;
  color: #bbb;
  opacity: 0.28;
  transform: translateY(8px);
  transition: opacity 0.35s ease, transform 0.35s ease, background 0.25s ease;
}
.flow-steps li.done,
.flow-steps li.on {
  opacity: 1;
  color: var(--ink);
  transform: none;
}
.flow-steps li.on {
  background: #f7f8fa;
  border-left-color: var(--accent);
  border-radius: 0 10px 10px 0;
}
.flow-steps li::before {
  content: "";
  position: absolute;
  left: -6px;
  top: 16px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ddd;
}
.flow-steps li.done::before { background: #9ca3af; }
.flow-steps li.on::before {
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.18);
}
.flow-steps li b { display: block; font-size: 13px; }
.flow-steps li span { display: block; margin-top: 3px; font-size: 13px; color: #555; }
.flow-steps li .more { margin: 4px 0 0; font-size: 12px; color: #777; line-height: 1.4; }
#flow-replay { margin-top: 12px; }
body.on-play .cases-layout { grid-template-columns: 1fr; }
body.on-play #cases-list { display: none; }
body.on-play main#cases-view { max-width: 1100px; }
.play-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.play-bar .flow-tracks { margin: 0; flex: 1; }
.play-now {
  position: sticky;
  top: 0;
  z-index: 4;
  margin: 0 0 8px;
  padding: 10px 0;
  background: #fff;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
}
.play-stage { min-height: 0; }
.play-scene {
  min-height: 78vh;
  padding: 20px 0 64px;
  opacity: 0.22;
  transform: translateY(12px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.play-scene.on,
.play-scene.done {
  opacity: 1;
  transform: none;
}
.scene-kicker {
  margin: 0 0 12px;
  color: #888;
  font-size: 13px;
  font-weight: 700;
}
.scene-body { margin: 0; font-size: 18px; line-height: 1.5; }
.play-quiz h3 { margin: 0 0 10px; font-size: 20px; }
.play-quiz .no { margin: 0 0 4px; color: #999; font-size: 12px; font-weight: 700; }
.opt.picked {
  box-shadow: 0 0 0 2px var(--accent);
  background: var(--pick);
  animation: pickpop 0.28s ease;
}
.conf-opt.picked {
  color: var(--ink);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}
@keyframes pickpop {
  from { transform: scale(0.98); }
  to { transform: scale(1); }
}
.play-gwrap { position: relative; }
.play-gstage {
  position: sticky;
  top: 52px;
  z-index: 2;
}
.play-graph {
  height: 440px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8fafc;
}
.play-gbadge {
  margin: 0 0 8px;
  padding: 8px 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.play-gbadge strong { display: block; font-size: 15px; }
.play-gbadge span { display: block; margin-top: 3px; color: #555; font-size: 13px; line-height: 1.35; }
.play-gwhy {
  margin: 8px 0 0;
  padding: 12px 14px;
  background: #fff7ed;
  border: 1px solid #fdba74;
  border-radius: 10px;
  color: #9a3412;
  font-size: 15px;
  line-height: 1.5;
}
.play-cap {
  margin: 8px 0 0;
  color: #777;
  font-size: 13px;
}
.play-way { min-height: 118vh; }
.play-gwhy { transition: opacity 0.55s ease; }
.payload { display: grid; gap: 8px; }
.bridge { display: grid; gap: 8px; margin: 0 0 20px; }
.bridge-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 6px 10px;
  align-items: start;
  padding: 10px 12px;
  border: 1px solid #fdba74;
  border-radius: 10px;
  background: #fff7ed;
  opacity: 0.25;
  transform: translateY(8px);
  transition: 0.28s ease;
}
.bridge-row.on { opacity: 1; transform: none; }
.bridge-row.off { border-color: var(--line); background: #f7f8fa; }
.bridge-row span { font-size: 14px; font-weight: 700; }
.bridge-row i { color: #c2410c; font-style: normal; }
.bridge-row code { color: var(--accent); font-size: 12px; }
.bridge-row p { grid-column: 1 / -1; margin: 0; color: #555; font-size: 13px; }
.pk {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  opacity: 0.2;
  transform: translateY(8px);
  transition: 0.28s ease;
}
.pk.on { opacity: 1; transform: none; background: #f7f8fa; }
.pk.graph.on { background: #ecfdf5; border-color: #6ee7b7; }
.pk .src-tag {
  display: inline-block;
  margin-bottom: 4px;
  padding: 1px 7px;
  border-radius: 999px;
  background: #eee;
  color: #555;
  font-size: 11px;
  font-weight: 700;
}
.pk.graph .src-tag { background: #d1fae5; color: #047857; }
.pk code {
  display: block;
  margin-bottom: 4px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}
.pk p { margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.45; }
@media (max-width: 800px) {
  .cases-layout { grid-template-columns: 1fr; }
  .cases-pick { max-height: 28vh; }
}

.debug { margin-top: 20px; color: #888; }
.debug pre { background: #fafafa; border: 1px solid var(--line); padding: 12px; overflow: auto; }

.graph-open {
  margin-top: 36px;
  width: 100%;
}
.graph-open + .graph-open { margin-top: 10px; }
#home-view { display: flex; flex-direction: column; }
#home-view[hidden] { display: none; }
body.on-graph .top { padding: 8px 16px 0; }
body.on-graph main#graph-view {
  max-width: none;
  padding: 8px 12px 12px;
}
.graph-stage {
  position: relative;
  height: calc(100vh - 72px);
  min-height: 640px;
}
#graph-canvas {
  width: 100%;
  height: 100%;
  border: 1px solid #222;
  border-radius: 12px;
  background: #1b1d22;
}
.graph-toolbar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-items: center;
  pointer-events: none;
}
.graph-toolbar > * { pointer-events: auto; }
.graph-filters, .graph-kinds { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.graph-filters button {
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(20,22,28,0.88);
  color: #e5e7eb;
  border-radius: 999px;
  padding: 3px 9px;
  font: inherit;
  font-size: 12px;
  line-height: 1.2;
  cursor: pointer;
}
.graph-filters button.on { border-color: #93c5fd; color: #93c5fd; font-weight: 700; }
.graph-kinds label { font-size: 11px; color: #d4d4d8; background: rgba(20,22,28,0.88); border-radius: 999px; padding: 3px 8px; }
#graph-search {
  width: 140px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(20,22,28,0.88);
  color: #f4f4f5;
  border-radius: 999px;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
}
.graph-detail {
  position: absolute;
  left: 10px;
  bottom: 48px;
  width: min(320px, 40vw);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 10px 12px;
  background: rgba(250,250,250,0.96);
  font-size: 13px;
  max-height: 36%;
  overflow: auto;
}
.graph-detail[hidden] { display: none !important; }
.graph-detail h3 { margin: 0 0 6px; font-size: 15px; }

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function chipify(text) {
  let s = esc(text)
    .replace(/\(으\)로/g, "⟦EU⟧")
    .replace(/을\(를\)/g, "⟦UL⟧")
    .replace(/\(이\)라면/g, "⟦IF⟧")
    .replace(/\(이\)면/g, "⟦IM⟧");
  s = s.replace(/\[([^\]]+)\]/g, '<span class="chip dd">$1</span>');
  s = s.replace(/\(\(([^)]+)\)\s*([+\-−×*/])\s*\(([^)]+)\)\)/g, '<span class="chip">$1 $2 $3</span>');
  s = s.replace(/\(([^)]+)\)/g, (_, n) => `<span class="chip${/값|번째/.test(n) ? " dd" : ""}">${n}</span>`);
  return s
    .replace(/⟦EU⟧/g, "(으)로")
    .replace(/⟦UL⟧/g, "을(를)")
    .replace(/⟦IF⟧/g, "(이)라면")
    .replace(/⟦IM⟧/g, "(이)면");
}

function blockKind(line) {
  const t = line.trim();
  if (t.includes("시작하기")) return "hat";
  if (t.startsWith("함수 정의") || t.startsWith("함수 ")) return "fn";
  if (t.includes("반복") || t.startsWith("만일") || t.startsWith("아니면")) return "ctrl";
  if (t.startsWith("▤") || t.startsWith("◇")) return "decl";
  if (/정하기|더하기|말하기|삭제|추가|항목/.test(t)) return "var";
  return "cmd";
}

function renderBlocks(text) {
  if (!text) return "";
  return text
    .split("\n")
    .map((line) => {
      if (!line.trim()) return "";
      const kind = blockKind(line);
      const pad = Math.min((line.match(/^\s*/) || [""])[0].length, 16);
      const inner = kind === "hat" ? esc(line.trim()) : chipify(line.trim());
      return `<div class="blk ${kind}" style="margin-left:${pad * 7}px">${inner}</div>`;
    })
    .join("");
}

function renderTable(md) {
  if (!md) return "";
  const rows = md
    .trim()
    .split("\n")
    .map((l) => l.trim())
    .filter((l) => l.includes("|") && !/^[\s|:-]+$/.test(l));
  if (!rows.length) return "";
  const cells = rows.map((r) =>
    r
      .replace(/^\|/, "")
      .replace(/\|$/, "")
      .split("|")
      .map((c) => c.trim())
  );
  return `<table><thead><tr>${cells[0].map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${cells
    .slice(1)
    .map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`)
    .join("")}</tbody></table>`;
}

function josa(word, a, b) {
  const ch = String(word || "").trim().replace(/\([^)]*\)$/, "").trim().slice(-1);
  if (/[0-9]/.test(ch)) return "013678".includes(ch) ? a : b;
  const code = ch.charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return b;
  return code % 28 ? a : b;
}

  function questionHtml(it, opts = {}) {

  // 단계 i에서 문제 화면의 모양
  function quizState(i) {
    return {
      q: [
        { show: i >= 0, center: i <= 2, picked: i >= 1, graded: i >= 2, reduced: i >= 6 },

  function applyQuiz(st, anim) {

  // ---------- 2. 그래프 탐색 · LLM 입력 ----------
  const NODE_FONT = { size: 17, face: "Pretendard, sans-serif", multi: false };
  const EDGE_FONT = { size: 14, face: "Pretendard, sans-serif", strokeWidth: 4, strokeColor: "#fff" };

  function nodeStyle(kind, st) {
    const c = KIND_COLOR[kind] || KIND_COLOR.concept;
    if (st === "dim") {

  function positions() {
    const p = D.data.graph.path;
    const pos = {};
    p.options.forEach((id, i) => (pos[id] = { x: -450, y: (i - (p.options.length - 1) / 2) * 150 }));

    const cardY = [210, -210, 340, -340];
    let ci = 0;

    D.data.graph.nodes.forEach((n) => {
      if (pos[n.id]) return;
      if (n.kind === "card") pos[n.id] = { x: -160, y: cardY[ki++ % cardY.length] };
      else if (n.kind === "resource") pos[n.id] = { x: 350, y: 250 + 120 * ci++ };
      else pos[n.id] = { x: 120, y: conceptY[ci++ % conceptY.length] };
    });
    return pos;
  }

  // 단계 i에서 노드·선 상태(dim / lit 지금 찾음 / done 지나옴)
  function graphState(i) {

    const set = (obj, ids, lit) => ids.forEach((id) => (obj[id] = lit ? "lit" : "done"));
    const optEdges = D.edgeIds.opt;
    if (i >= 9) set(nodes, p.options, i === 9);
    if (i >= 10) {
      set(nodes, [p.card], i === 10);
      set(edges, optEdges, i === 10);
    }
    if (i >= 11) {
      set(nodes, [p.concept], i === 11);
      set(edges, D.edgeIds.card, i === 11);
    }
    if (i >= 12) {
      set(nodes, p.resources, i === 12);
      set(edges, D.edgeIds.res, i === 12);
    }
    return { nodes, edges };
  }

  function ensureGraph() {
    if (D.net) return;
    const g = D.data.graph;
    const pos = positions();
    const kindOf = {};
    g.nodes.forEach((n) => (kindOf[n.id] = n.kind));

    D.nodes = new vis.DataSet(
      g.nodes.map((n) => ({
        id: n.id,
        label: n.label,
        x: pos[n.id].x,
        y: pos[n.id].y,
        fixed: true,
        shape: "box",

        widthConstraint: { maximum: n.kind === "card" ? 200 : 160 },

    );

    D.edges = new vis.DataSet(
      g.edges.map((e, i) => {
        const id = `de${i}`;
        if (p.options.includes(e.from) && e.to === p.card) D.edgeIds.opt.push(id);
        if (e.from === p.card && e.to === p.concept) D.edgeIds.card.push(id);
        if (e.from === p.concept && p.resources.includes(e.to)) D.edgeIds.res.push(id);
        return { id, from: e.from, to: e.to, label: e.rel_label, arrows: "to", smooth: false, ...edgeStyle("dim") };
      })
    );
    D.net = new vis.Network(
      el("demo-graph"),
      { nodes: D.nodes, edges: D.edges },
      {
        physics: { enabled: false },
        layout: { improvedLayout: false },
        interaction: { dragNodes: false, dragView: false, zoomView: false, selectable: false, hover: false },
      }
    );
    D.net.fit({ animation: false, padding: 24 });
  }

  function paintGraph(i) {
    const st = graphState(i);
    D.nodes.update(D.data.graph.nodes.map((n) => ({ id: n.id, ...nodeStyle(n.kind, st.nodes[n.id] || "dim") })));
    D.edges.update(D.edges.getIds().map((id) => ({ id, ...edgeStyle(st.edges[id] || "dim") })));
  }

  function srcOf(key) {
    return SRC[key] || "concept";
  }

  function buildLlm() {
    const inp = D.data.llm_input;
    const keys = Object.keys(inp);
    const lines = keys.map(
      (k, i) =>
        `<span class="jl" data-k="${esc(k)}"><span class="jk">"${esc(k)}"</span>: <span class="jv empty">▢</span>${i < keys.length - 1 ? "," : ""}</span>`
    );
    el("demo-llm").innerHTML = `{${lines.join("")}}<span class="demo-sent">→ LLM으로 보냄</span>`;
    el("demo-direct").innerHTML = "";
  }

  function setLine(k, filled, flash) {
    const line = el("demo-llm").querySelector(`.jl[data-k="${k}"]`);

      v.textContent = JSON.stringify(D.data.llm_input[k]);

      v.textContent = "▢";
      v.classList.add("empty");

      line.classList.remove("flash");

      line.classList.add("flash");
    }
  }

      : "";
  }

  function nodeScreen(id) {
    const p = D.net.getPositions([id])[id];
    const dom = D.net.canvasToDOM(p);
    const r = el("demo-graph").getBoundingClientRect();
    return { x: r.left + dom.x, y: r.top + dom.y };
  }

  // 그래프에서 찾은 노드의 내용이 LLM 입력 칸으로 날아가는 모습
  function fly(fromId, target, text, delay, done) {
    later(() => {
      const s = nodeScreen(fromId);
      const t = target.getBoundingClientRect();

      f.style.top = `${s.y - 14}px`;

        requestAnimationFrame(() => {
          f.style.transform = `translate(${t.left - s.x + 40}px, ${t.top - s.y + 14}px)`;
          f.style.opacity = "0.25";

      );
      later(() => {
        f.remove();
        done();
      }, 850);
    }, delay);
  }

  function applySearch(i, anim) {
    paintGraph(i);
    el("demo-llm").classList.toggle("sent", i >= SENT_STEP);
    const keys = Object.keys(D.data.llm_input);
    const p = D.data.graph.path;
    const fromNode = { card: p.card, concept: p.concept };
    let k = 0;
    keys.forEach((key) => {
      const at = FILL_STEP[srcOf(key)];
      const filled = i >= at;
      if (anim && i === at) {
        setLine(key, false, false);
        const line = el("demo-llm").querySelector(`.jl[data-k="${key}"]`);
        const src = srcOf(key);
        if (src === "item") {
          later(() => setLine(key, true, true), 250 + 250 * k++);
        } else {
          const v = D.data.llm_input[key];
          fly(fromNode[src], line, typeof v === "string" ? v : JSON.stringify(v), 300 + 650 * k++, () => setLine(key, true, true));
        }
      } else {
        setLine(key, filled, false);
      }
    });
    if (anim && i === PAGES_STEP) {
      setPages(false);
      let left = p.resources.length;
      p.resources.forEach((rid, n) =>
        fly(rid, el("demo-direct"), `교과서 ${D.data.server_pages[n] || ""}쪽`, 300 + 450 * n, () => {
          left -= 1;
          if (!left) setPages(true);
        })
      );
    } else {
      setPages(i >= PAGES_STEP);
    }
  }

  // ---------- 3. 피드백 ----------
  function renderFeedback(anim) {
    const fb = D.data.feedback;
    const it = D.data.items.find((x) => x.display_no === fb.display_no) || D.data.items[1];
    el("demo-fb").innerHTML = `<article class="dq show graded demo-fbcard">
        ${questionHtml(it, { graded: true, mark: "오개념을 확인해 봐요" })}
        <p class="demo-fbtext" id="demo-fbtext"></p>
        <p class="demo-server">교과서 ${esc(pagesText())}쪽</p>
      </article>`;
    const box = el("demo-fbtext");
    if (!anim) {
      box.textContent = fb.text;
      return;
    }
    const text = fb.text;
    for (let n = 1; n <= text.length; n += 1) later(() => (box.textContent = text.slice(0, n)), 400 + n * 22);
  }

  // ---------- 단계 이동 ----------
  function render(i, anim) {
    cancelAll();
    const phase = STEPS[i].phase;
    el("demo-quiz").hidden = phase !== "quiz";
    el("demo-search").hidden = phase !== "search";
    el("demo-fb").hidden = phase !== "fb";
    if (phase === "quiz") {
      if (anim) {
        instant(() => applyQuiz(quizState(i - 1), false));
        applyQuiz(quizState(i), true);
      } else {
        instant(() => applyQuiz(quizState(i), false));
      }
    } else if (phase === "search") {
      ensureGraph();
      if (!el("demo-llm").innerHTML) buildLlm();
      if (anim && i > 0 && STEPS[i - 1].phase === "search") applySearch(i - 1, false);
      applySearch(i, anim);
    } else {
      renderFeedback(anim);
    }
    D.step = i;
    el("demo-progress").textContent = `${i + 1} / ${STEPS.length}`;
    el("demo-text").textContent = STEPS[i].text();
  }

  function next() {
    if (D.step < STEPS.length - 1) render(D.step + 1, true);
  }

  function prev() {
    if (D.step > 0) render(D.step - 1, false);
  }

  async function openDemo() {
    show("demo");
    $("page-title").textContent = "판정 시연 · I-LDEL 오개념";
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (!D.data) {
      el("demo-text").textContent = "불러오는 중…";
      // 한 파일 HTML(docs/index.html, tools/build_demo_html.py)은 데이터를 window.DEMO_DATA로 품고 있다
      D.data = window.DEMO_DATA || (await fetch("/api/demo-case").then((r) => r.json()));
    }
    buildQuiz();
    el("demo-llm").innerHTML = "";
    instant(() => applyQuiz(quizState(-1), false));
    D.step = -1;
    render(0, true);
  }

  function leaveDemo() {
    cancelAll();
    D.step = -1;
    if (D.net) {
      D.net.destroy();
      D.net = null;
    }
  }

  document.addEventListener("keydown", (e) => {
    if (state.phase !== "demo" || D.step < 0) return;
    if (e.key === "Enter") {
      e.preventDefault();
      next();
    } else if (e.key === "Backspace") {
      e.preventDefault();
      prev();
    }
  });

  window.addEventListener("resize", () => {
    if (D.net) D.net.fit({ animation: false, padding: 24 });
  });

  window.openDemo = openDemo;
  window.leaveDemo = leaveDemo;
  const btn = el("open-demo");
  if (btn) btn.onclick = openDemo;
})();

  </script>
  <script>
openDemo();
  </script>
</body>
</html>
