<!DOCTYPE html>
<!--
  판정 시연 화면 : 오개념 사례 하나를 한 슬라이드씩(1~15) 보여 준다.
  - 화면에 보이는 글자와 데이터는 모두 data.js에 있다. 내용을 바꿀 때는 data.js만 고친다.
  - 이 파일은 화면 모양(CSS)과 동작(JS)만 담는다.
  - 넘기기: Enter · → · PageDown · 화면 클릭(휴대폰은 탭) / 이전: Backspace · ← · PageUp · 이전 버튼
  - 실행 방법, 슬라이드 표, 배포는 README.md 참고.
  - 주의: 아래 <script src="data.js"> 줄은 배포(.github/workflows/static.yml)가 찾아서 고치는 줄이라 모양을 바꾸지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판정 시연</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
/* =========================================================================
 * 0. 색 (여기 값만 바꾸면 화면 전체 색이 바뀐다)
 * ========================================================================= */
:root {
  --ink: #111;
  --line: #ececec;
  /* 학생이 고르는 표시(선지·확신도) : 무채색 */
  --pick: #111;
  --pick-bg: #f3f4f6;
  /* 오답·오개념 : 가장 강한 강조 */
  --wrong: #dc2626;
  --wrong-bg: #fdecec;
  --wrong-ink: #b91c1c;
  /* 정답 : 약한 강조(테두리·글자만) */
  --right: #15803d;
  --right-line: #86c79e;
  --right-bg: #f0fdf4;
  /* 그래프에서 지금 따라가는 길 */
  --trail: #f59e0b;
  /* 엔트리 블록 색 (시작 · 자료(변수) · 생김새 · 입력 칸) — -dark는 테두리·드롭다운 색 */
  --hat: #45c043;
  --hat-dark: #2f9e2f;
  --var: #c94fd1;
  --var-dark: #a336ad;
  --looks: #ea4465;
  --looks-dark: #c42f4f;
  --field: #fff6c7;
  --decl: #e67e22;
  --ctrl: #f0a033;
  --fn: #6b5ce7;
}

/* =========================================================================
 * 1. 페이지 틀 : 위 제목 / 가운데 무대 / 맨 아래 회색 설명 칸
 *    무대가 남는 높이를 모두 차지해서 설명 칸이 화면 아래에 붙는다.
 *    내용이 화면보다 길면(휴대폰 등) 설명 칸이 화면 아래에 고정된다.
 * ========================================================================= */
* { box-sizing: border-box; }
html {
  background: #fff;
  touch-action: manipulation; /* 휴대폰에서 두 번 탭할 때 확대되지 않게 */
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  color: var(--ink);
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  letter-spacing: -0.02em;
  -webkit-user-select: none; /* 클릭으로 넘길 때 글자가 선택되지 않게 */
  user-select: none;
}
.top { padding: 12px 24px 0; }
h1 { margin: 4px 0 0; font-size: 20px; font-weight: 700; }
main#demo-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 8px 24px 0;
}
.demo-stage { flex: 1; min-height: 520px; overflow-x: clip; }
.demo-stage [hidden] { display: none !important; }
/* 슬라이드를 건너뛸 때(Backspace 등) 움직임 없이 바로 바꾸기 위한 클래스 */
.demo-stage.noanim,
.demo-stage.noanim * { transition: none !important; }

/* 맨 아래 회색 설명 칸 */
.demo-explain {
  position: sticky;
  bottom: 8px;
  z-index: 20;
  margin: 36px 0 8px;
  padding: 14px 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f7f8fa;
}
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 4px; }
.demo-progress { margin: 0; color: #999; font-size: 12px; font-weight: 700; }
.demo-text { margin: 0; color: #222; font-size: 16px; line-height: 1.55; }
.demo-text b { font-weight: 800; }
.demo-error { color: var(--wrong-ink); font-weight: 700; }
.demo-keys { margin: 8px 0 0; color: #aaa; font-size: 12px; }
.hint-tap { display: none; }
/* 이전/다음 버튼 : 휴대폰·좁은 화면에서만 보인다 */
.demo-nav { display: none; gap: 6px; }
.demo-nav button {
  padding: 6px 16px;
  border: 1px solid #d4d4d8;
  border-radius: 999px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.demo-nav button.next { border-color: var(--ink); background: var(--ink); color: #fff; }
.demo-nav button:disabled { opacity: 0.3; cursor: default; }
@media (pointer: coarse), (max-width: 900px) {
  .demo-nav { display: flex; }
  .hint-keys { display: none; }
  .hint-tap { display: inline; }
}

/* =========================================================================
 * 2. 엔트리 블록 코드 (문제 안 코드)
 * ========================================================================= */
/* 블록은 엔트리처럼 위아래로 붙여 쌓는다 */
.blocks { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.blk {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 35px;
  padding: 4px 6px 4px 12px;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 18px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
}
/* 시작 블록: 왼쪽에 흰 동그라미 안 초록 ▶ */
.blk.hat { padding: 4px 16px 4px 5px; background: var(--hat); border-color: var(--hat-dark); }
.hat-ico { position: relative; flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
.hat-ico::after {
  content: "";
  position: absolute;
  left: 9.5px;
  top: 7px;
  border-style: solid;
  border-width: 6px 0 6px 9px;
  border-color: transparent transparent transparent var(--hat);
}
.blk.var { background: var(--var); border-color: var(--var-dark); }   /* 자료(변수): '정하기' */
.blk.looks { background: var(--looks); border-color: var(--looks-dark); } /* 생김새: '말하기' */
.blk.ctrl { background: var(--ctrl); }
.blk.fn { background: var(--fn); }
.blk.decl { background: var(--decl); }
.blk.cmd { background: #888; }
/* 블록 안 칩: (값) = 옅은 노란 입력 칸, [이름] = 드롭다운(▾), (… 칩 …) = 값 블록 */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 9px;
  background: var(--field);
  color: #333;
  font-size: 14px;
  font-weight: 600;
}
.chip.dd { background: var(--var-dark); color: #fff; }
.blk.looks > .chip.dd { background: var(--looks-dark); }
.chip.dd::after {
  content: "";
  margin-left: 2px;
  border: 3.5px solid transparent;
  border-top-color: #fff;
  border-bottom-width: 0;
}
/* 값 블록 '([단어] 값)': 자료(변수) 색 */
.chip.rep { padding: 2px 8px 2px 3px; border: 1px solid var(--var-dark); border-radius: 12px; background: var(--var); color: #fff; }
.chip.rep .chip.dd { background: var(--var-dark); }
/* 블록 끝 동그라미 아이콘: 자료(?) · 생김새 */
.blk-ico { display: inline-grid; place-items: center; flex: 0 0 auto; width: 23px; height: 23px; border-radius: 50%; }
.blk-ico.q { background: rgba(255, 255, 255, 0.4); color: var(--var-dark); font-size: 13px; font-weight: 800; }
.blk-ico svg { width: 13px; height: 13px; }
.blk-ico.lk { background: rgba(255, 255, 255, 0.3); }

/* =========================================================================
 * 3. 문제 카드 (슬라이드 1~8, 15 왼쪽)
 * ========================================================================= */
.demo-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.dq {
  min-width: 0;
  padding: 20px 22px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  opacity: 0;
  transform: translateX(24px); /* 오른쪽에서 살짝 들어옴 */
  transition: opacity 0.45s ease, transform 0.5s ease;
}
.dq.show { opacity: 1; transform: none; }
/* 문제 1만 있을 때(슬라이드 1~3)는 가운데 */
#demo-q0.show.center { transform: translateX(calc(50% + 14px)); }
.dq-no { margin: 0 0 6px; color: #999; font-size: 14px; font-weight: 700; }
.dq-mark { color: var(--wrong-ink); }
.dq-stem { margin: 0 0 14px; font-size: 21px; font-weight: 700; line-height: 1.35; }
.dq-code { margin: 0 0 12px; }

/* 슬라이드 7에 문제·안 고른 선지를 접는 장치 */
.dfold {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
}
.dfold > * { min-height: 0; overflow: hidden; }
.dq.reduced .dfold:not(.keep) { grid-template-rows: 0fr; opacity: 0; }

/* --- 선지 --- */
.dq-opts .dopt { margin-bottom: 6px; }
.dopt {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0 10px;
  padding: 10px 14px;
  border: 1px solid #eee;
  border-radius: 10px;
  background: #fff;
  font-size: 17px;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.dopt-text { flex: 1; min-width: 0; }
.dradio {
  position: relative;
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  border: 1.5px solid #bbb;
  border-radius: 50%;
  background: #fff;
  transition: border-color 0.25s ease;
}
/* 라디오 안쪽 점: 고르면 가운데서 커지며 채워진다 */
.dradio::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--pick);
  transform: scale(0);
  transition: transform 0.25s ease, background-color 0.25s ease;
}
/* 확신도 체크는 조금 더 천천히 칠해진다 */
.dconf .dradio, .dconf .dradio::after { transition-duration: 0.4s; }
/* 학생이 고름 (슬라이드 2·5) : 무채색 */
.dopt.on { border-color: var(--pick); background: var(--pick-bg); box-shadow: 0 0 0 1px var(--pick); }
.on > .dradio { border-color: var(--pick); }
.on > .dradio::after { transform: scale(1); }
/* 채점 (슬라이드 3·6) : 고른 오답 = 강한 빨강 */
.dq.graded .dopt.chosen:not(.correct) { background: var(--wrong-bg); border-color: var(--wrong); box-shadow: 0 0 0 1.5px var(--wrong); }
.dq.graded .dopt.chosen:not(.correct) > .dradio { border-color: var(--wrong); }
.dq.graded .dopt.chosen:not(.correct) > .dradio::after { background: var(--wrong); }
.dq.graded .dopt.chosen:not(.correct) .dopt-text { color: var(--wrong-ink); font-weight: 700; }
/* 채점 : 정답 = 약한 초록(테두리·글자만) */
.dq.graded .dopt.correct { border-color: var(--right-line); }
.dq.graded .dopt.correct .dopt-text { color: var(--right); }
/* (학생이 정답을 골랐을 때) */
.dq.graded .dopt.chosen.correct { background: var(--right-bg); border-color: var(--right); box-shadow: 0 0 0 1.5px var(--right); }
/* 선지 오른쪽 표시 : ✕ 오답 / ✓ 정답 (채점 때 나타남, 글자만) */
.dbadge {
  flex: 0 0 auto;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s ease 0.1s;
}
.dq.graded .dbadge { opacity: 1; }
.dbadge.wrong { color: var(--wrong-ink); }
.dbadge.right { color: var(--right); }

/* --- 확신도 : "확신도" 제목 줄 + ○ 확실해요 · ○ 조금 확실해요 · ○ 잘 모르겠어요 --- */
.dq-conf { margin-top: 12px; }
.dq-conf-h { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.dq-conf-row { display: flex; flex-wrap: wrap; align-items: center; color: #444; font-size: 16px; }
.dconf {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 200px;
  padding: 2px 4px;
  overflow: hidden;
  white-space: nowrap;
  transition: max-width 0.45s ease, opacity 0.35s ease, padding 0.45s ease, color 0.4s ease;
}
.dconf.on { color: var(--ink); font-weight: 700; }
.dsep {
  max-width: 30px;
  padding: 0 8px;
  overflow: hidden;
  color: #bbb;
  transition: max-width 0.45s ease, opacity 0.35s ease, padding 0.45s ease;
}
/* 슬라이드 7부터 고른 확신도만 남김 */
.dq.reduced .dconf:not(.chosen),
.dq.reduced .dsep { max-width: 0; padding-left: 0; padding-right: 0; opacity: 0; }

/* =========================================================================
 * 4. 판정 규칙 상자 (슬라이드 8) : 두 응답 → 규칙 체크 → 결과 (차례로 나타남)
 * ========================================================================= */
.demo-judge { margin-top: 24px; }
.jrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
/* 왼쪽→오른쪽으로 차례차례 나타남(--i = 순서, 0.25초 간격) */
.ji {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  transition-delay: calc(var(--i, 0) * 0.25s);
}
.demo-judge.on .ji { opacity: 1; transform: none; }
.jans { display: flex; flex-direction: column; gap: 8px; }
.jchip {
  padding: 8px 12px;
  border: 1px solid #f1b4b4;
  border-radius: 10px;
  background: var(--wrong-bg);
  color: var(--wrong-ink);
  font-size: 15px;
  font-weight: 600;
}
.jchip b { font-weight: 800; }
.jarrow { color: #999; font-size: 22px; font-weight: 700; text-align: center; }
.jrule { min-width: 320px; padding: 12px 16px; border: 1px solid #d4d4d8; border-radius: 12px; background: #fafafa; }
.jrule-h { margin: 0; font-size: 15px; font-weight: 800; }
.jrule-note { margin: 2px 0 10px; color: #777; font-size: 12px; }
.jrule ul { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.jrule li { display: flex; align-items: center; gap: 8px; font-size: 15px; }
/* ✓ 동그라미 */
.jcheck {
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
}
.jresult { padding: 12px 22px; border-radius: 12px; background: var(--wrong); color: #fff; font-size: 18px; font-weight: 800; text-align: center; }

/* =========================================================================
 * 5. 그래프 탐색 · LLM 입력 (슬라이드 9~14)
 * ========================================================================= */
.demo-search { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.demo-h { margin: 0 0 6px; color: #666; font-size: 13px; font-weight: 700; }
/* 그래프 위에 투명한 덮개를 씌운다: 그래프는 손대지 않는 그림이고, 클릭·탭·스크롤은 페이지로 간다 */
.demo-gwrap { position: relative; }
.demo-gcover { position: absolute; inset: 0; z-index: 1; }
.demo-graph { height: 540px; border: 1px solid var(--line); border-radius: 12px; background: #fcfcfd; }
/* 그래프 아래 범례 */
.demo-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: #666; font-size: 12px; }
.demo-legend i {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-right: 5px;
  border-radius: 50%;
  vertical-align: -1px;
}
.demo-legend i.trail { width: 18px; height: 0; border: 0; border-top: 3px solid var(--trail); border-radius: 0; vertical-align: 3px; }

/* 오른쪽 상자 : LLM 입력 (칸 이름 | 값) */
.demo-llm {
  margin: 0 0 14px;
  padding: 10px 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: #222;
  font-size: 13px;
  line-height: 1.55;
  transition: border-color 0.4s ease;
}
.jl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 4px 8px; border-radius: 6px; transition: background-color 0.35s ease; }
/* 이번 슬라이드에서 새로 채워진 칸: 노란 바탕이 번지고 값이 스르륵 나타남 (.enter = 나타나기 직전) */
.jl.new { background: #fff7e6; }
.jl.enter { background: transparent; }
.jk { color: #888; font-weight: 700; word-break: keep-all; }
.jv { color: #111; white-space: pre-wrap; overflow-wrap: anywhere; transition: opacity 0.45s ease, transform 0.45s ease; }
.jl.enter .jv { opacity: 0; transform: translateX(-6px); }
/* 빈칸: 글자는 투명하게 자리만 잡고, 그 위에 ▢ 표시 */
.jv.empty { position: relative; color: transparent; }
.jv.empty::before { content: "▢"; position: absolute; left: 0; top: 0; color: #ccc; }
/* "→ LLM으로 보냄": 자리는 처음부터 비워 두고(상자 높이가 바뀌지 않게) 보낼 때 글자만 나타난다 */
.demo-sent { margin: 8px 8px 0; color: var(--right); font-weight: 700; visibility: hidden; opacity: 0; transition: opacity 0.4s ease; }
.demo-llm.sent { border-color: var(--right); }
.demo-llm.sent .demo-sent { visibility: visible; opacity: 1; }
/* 오른쪽 아래 : LLM에 넣지 않고 화면에 바로 붙이는 교과서 쪽 */
.demo-direct { display: flex; flex-wrap: wrap; gap: 8px; min-height: 46px; padding: 10px 12px; border: 1px dashed #d4d4d4; border-radius: 10px; }
.demo-page { padding: 3px 10px; border: 1px solid #d4d4d8; border-radius: 6px; background: #fff; color: #333; font-size: 13px; font-weight: 600; transition: opacity 0.45s ease, transform 0.45s ease, background-color 0.35s ease; }
/* 이번 슬라이드에서 새로 붙은 교과서 쪽 (LLM 입력의 .jl.new와 같은 바탕, 같은 방식으로 나타남) */
.demo-page.new { background: #fff7e6; }
.demo-page.enter { opacity: 0; transform: translateY(4px); background: #fff; }

/* =========================================================================
 * 6. 피드백 (슬라이드 15) : 문제 카드 안, 선지·확신도 아래 회색 상자에 피드백 한 문단
 * ========================================================================= */
.fb-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 1040px; margin: 0 auto; }
/* 피드백 화면의 문제 카드: 높이를 줄이려고 카드 안을 왼쪽(문제·코드) | 오른쪽(선지·확신도)으로 나눈다 */
.fb-q { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); column-gap: 24px; align-items: start; }
.fb-q > .dq-no { grid-column: 1 / -1; }
.fb-q > .dfold { grid-column: 1; grid-row: 2 / span 3; }
.fb-q > .dq-opts { grid-column: 2; grid-row: 2; }

.fb-box .fb-para { padding: 0; }
.fb-box .fb-pages { margin: 12px 0 0; border-top-color: #e3e5e9; }
.fb-h { margin: 0 0 6px; color: #888; font-size: 13px; font-weight: 700; }
/* 문단 → 문단 → 문단 → 교과서 쪽 줄 순서로 차례로 나타남(--i = 순서, 판정 상자와 같은 0.25초 간격) */
.fb-para, .fb-pages {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  transition-delay: calc(var(--i, 0) * 0.25s + 0.1s);
}
.fb-body.on .fb-para, .fb-body.on .fb-pages { opacity: 1; transform: none; }
/* 세 문단 모두 같은 여백(마지막만 초록 바탕) → 문단 사이 간격이 같아 보이게 */
.fb-para { padding: 10px 14px; border: 1px solid transparent; border-radius: 10px; }
.fb-para + .fb-para { margin-top: 4px; }
/* 문단 소제목: 번호 동그라미 + 이름 */
.fb-label { display: flex; align-items: center; gap: 7px; margin: 0 0 4px; color: #555; font-size: 13px; font-weight: 800; }
.fb-label .n {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;

}
.fb-text { margin: 0; font-size: 17px; line-height: 1.7; }
.fb-text b { font-weight: 700; }
/* 마지막 문단(정개념) 강조: 옅은 초록 상자 */
.fb-para.key { border-color: #c7ebd2; background: var(--right-bg); }
.fb-para.key .fb-label { color: var(--right); }
.fb-para.key .fb-label .n { background: var(--right); }
.fb-pages { margin: 14px 14px 0; padding-top: 12px; border-top: 1px solid var(--line); color: #333; font-size: 15px; }
.fb-pages span { margin-right: 10px; color: #888; font-size: 13px; font-weight: 700; }

/* =========================================================================
 * 7. 좁은 화면(휴대폰)
 * ========================================================================= */
@media (max-width: 900px) {
  .top { padding: 10px 16px 0; }
  h1 { font-size: 17px; }
  main#demo-view { padding: 6px 16px 0; }
  .demo-stage { min-height: 0; }
  .demo-cols, .demo-search, .fb-cols { grid-template-columns: 1fr; gap: 14px; }
  /* 휴대폰: 피드백 문제 카드도 위→아래 한 줄로 */
  .fb-q { display: block; }
  #demo-q0.show.center { transform: none; }
  .dq { padding: 14px 12px; }
  .dq-stem { font-size: 17px; }
  .blk { flex-wrap: wrap; white-space: normal; font-size: 13px; min-height: 30px; }
  .chip { font-size: 12.5px; }
  .dopt { font-size: 15px; padding: 8px 12px; }
  /* 판정 상자: 위→아래로, 화살표도 아래 방향 */
  .jrow { flex-direction: column; align-items: stretch; gap: 10px; }
  .jarrow { font-size: 0; }
  .jarrow::before { content: "↓"; font-size: 22px; }

  .demo-graph { height: 600px; }
  .jl { grid-template-columns: 76px minmax(0, 1fr); }
  .fb-box { padding: 12px 12px; }

  .demo-explain { bottom: 0; margin: 20px -16px 0; padding: 10px 16px 12px; border-width: 1px 0 0; border-radius: 14px 14px 0 0; }

</head>
<body>
  <header class="top">
    <h1 id="page-title"></h1>
  </header>

  <main id="demo-view">
    <section id="demo-stage" class="demo-stage">
      <!-- 슬라이드 1~8 : 문제 풀기 · 판정 -->
      <div id="demo-quiz" hidden>
        <div class="demo-cols">
          <article id="demo-q0" class="dq"></article> <!-- 문제 1 -->
          <article id="demo-q1" class="dq"></article> <!-- 문제 2 -->
        </div>
        <div id="demo-judge" class="demo-judge"></div> <!-- 슬라이드 8 판정 규칙 상자 -->
      </div>

      <!-- 슬라이드 9~14 : 그래프 탐색 · LLM 입력 (제목 글자는 data.js SLIDE_9) -->
      <div id="demo-search" class="demo-search" hidden>
        <div>
          <p class="demo-h" id="t-graph"></p>
          <div class="demo-gwrap">
            <div id="demo-graph" class="demo-graph"></div>
            <div class="demo-gcover"></div>
          </div>
          <div id="demo-legend" class="demo-legend"></div>
        </div>
        <div>
          <p class="demo-h" id="t-llm"></p>
          <div id="demo-llm" class="demo-llm"></div>
          <p class="demo-h" id="t-direct"></p>
          <div id="demo-direct" class="demo-direct"></div>
        </div>
      </div>

      <!-- 슬라이드 15 : 피드백 -->
      <div id="demo-fb" hidden></div>
    </section>

    <!-- 맨 아래 회색 설명 칸 (글은 data.js 각 SLIDE_N.narration, 안내·버튼은 COMMON) -->
    <section id="demo-explain" class="demo-explain">
      <div class="demo-bar">
        <p id="demo-progress" class="demo-progress"></p>
        <div class="demo-nav">
          <button type="button" id="demo-prev"></button>
          <button type="button" id="demo-next" class="next"></button>
        </div>
      </div>
      <p id="demo-text" class="demo-text"></p>
      <p class="demo-keys"><span id="hint-keys" class="hint-keys"></span><span id="hint-tap" class="hint-tap"></span></p>
    </section>
  </main>

  <!-- 그래프 라이브러리(vis-network). 인터넷 연결이 필요하다 -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <!-- 시연 내용(글자·데이터). 이 줄은 배포가 찾아서 고치므로 모양을 바꾸지 않는다 -->
  <script src="data.js"></script>
  <script>
(() => {
  "use strict";
  const el = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  /* ----- {이름표} 채우기 -----
   * data.js 글 안의 {문제1.정답}, {오개념.이름} 같은 이름표를 값으로 바꾼다.
   * 값은 아래 V에 한 번만 모아 둔다(data.js를 읽은 뒤 makeVars가 채움). 칸마다 쓰는 {번호} 같은 것은 vars로 받는다.
   * 이름표 바로 뒤의 을/를, 이/가, 은/는, 과/와, 으로/로 는 값의 받침에 맞춰 하나를 고른다.
   * 모르는 이름표는 {이름표} 그대로 둔다(화면에 보여서 오타를 찾기 쉽게). */
  const V = {};
  const CIRCLED_DIGIT = { "①": "1", "②": "2", "③": "3", "④": "4", "⑤": "5", "⑥": "6", "⑦": "7", "⑧": "8", "⑨": "9" };
  function lastSound(word) {
    for (const ch0 of [...String(word)].reverse()) {
      const ch = CIRCLED_DIGIT[ch0] || ch0;
      const code = ch.charCodeAt(0);
      if (code >= 0xac00 && code <= 0xd7a3) {
        const jong = (code - 0xac00) % 28; // 받침 번호(0 = 없음, 8 = ㄹ)
        return { batchim: jong > 0, rieul: jong === 8 };
      }
      if (/[0-9]/.test(ch)) return { batchim: "013678".includes(ch), rieul: "178".includes(ch) }; // 영·일·삼·육·칠·팔
      if (/[a-z]/i.test(ch)) return { batchim: /[lmnr]/i.test(ch), rieul: /[lr]/i.test(ch) };
    }
    return { batchim: false, rieul: false };
  }
  function pickJosa(word, pair) {
    const [a, b] = pair.split("/");
    const strong = ["을", "이", "은", "과", "으로"].includes(a) ? a : b; // 받침 있을 때
    const weak = strong === a ? b : a;                                   // 받침 없을 때
    const s = lastSound(word);
    if (strong === "으로") return s.batchim && !s.rieul ? "으로" : "로"; // ㄹ 받침은 '로'
    return s.batchim ? strong : weak;
  }
  const JOSA = "을|를|이|가|은|는|과|와|으로|로";
  const PLACE = new RegExp(`\\{([^{}\\s]+)\\}([」』’”"')\\]]*)((?:${JOSA})/(?:${JOSA}))?`, "g");
  function fill(s, vars, wrap) {
    const all = { ...V, ...vars };
    return String(s ?? "").replace(PLACE, (m, key, close, pair) => {
      if (!(key in all)) return m;
      const val = String(all[key] ?? "");
      return wrap(val) + close + (pair ? pickJosa(val, pair) : "");
    });
  }
  const same = (x) => x;
  // data.js 글자 → 화면 HTML: **굵게**, {이름표} 채우기
  function rich(fmt, vars = {}) {
    return fill(esc(fmt).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"), vars, esc);
  }
  // data.js 글자 → 꾸밈 없는 글자(그래프 노드, LLM 입력 칸, 날아가는 쪽지)
  function plain(fmt, vars = {}) {
    return fill(String(fmt ?? "").replace(/\*\*/g, ""), vars, same);
  }
  // data.js가 깨졌을 때 등: 아래 회색 칸에 빨간 안내
  function showError(msg) {
    el("demo-progress").textContent = "!";
    el("demo-text").innerHTML = `<span class="demo-error">${esc(msg)}</span>`;
  }

  /* =======================================================================
   * 1. 슬라이드 정의 (1~15)
   *    각 슬라이드에서 화면이 어떻게 바뀌는지는 아래 함수들이 이 이름(key)을 보고 정한다.
   *    글자는 data.js의 SLIDE_N (N = 번호).
   * ======================================================================= */
  const STEPS = [
    { key: "q1_show", phase: "quiz" },     //  1 문제 1 등장(가운데)
    { key: "q1_pick", phase: "quiz" },     //  2 문제 1 답 → 확신도 고름
    { key: "q1_grade", phase: "quiz" },    //  3 문제 1 채점 + 오개념 노드 글
    { key: "q2_show", phase: "quiz" },     //  4 문제 2 등장(문제 1은 왼쪽으로)
    { key: "q2_pick", phase: "quiz" },     //  5 문제 2 답 → 확신도 고름
    { key: "q2_grade", phase: "quiz" },    //  6 문제 2 채점
    { key: "reduce", phase: "quiz" },      //  7 고른 답·확신도만 남김
    { key: "judge", phase: "quiz" },       //  8 판정 규칙 상자
    { key: "search", phase: "search" },    //  9 그래프·LLM 입력 등장, 문항 칸 채움
    { key: "g_options", phase: "search" }, // 10 선지 노드 켜짐
    { key: "g_card", phase: "search" },    // 11 오개념 노드 → 믿음 확인 질문·실행 반례 칸
    { key: "g_concept", phase: "search" }, // 12 정개념 노드 → 정개념·정개념 설명 칸
    { key: "g_pages", phase: "search" },   // 13 교과서 노드 → 오른쪽 아래 칸
    { key: "send", phase: "search" },      // 14 LLM으로 보냄
    { key: "feedback", phase: "fb" },      // 15 피드백
  ];
  const AT = {}; // 슬라이드 이름 → 번호(0부터)
  STEPS.forEach((s, i) => (AT[s.key] = i));

  // ----- data.js 읽기 -----
  const D = window.DEMO;
  if (!D || !D.common || !Array.isArray(D.slides)) {
    showError("data.js를 읽지 못했습니다. data.js에서 쉼표(,)·따옴표·괄호가 빠지지 않았는지 확인하세요. (F12 → Console에 틀린 줄 번호가 나옵니다)");
    return;
  }
  if (D.slides.length !== STEPS.length || D.slides.some((s) => !s)) {
    showError(`data.js의 슬라이드는 ${STEPS.length}개여야 합니다(지금 ${D.slides.length}개). 맨 아래 window.DEMO의 slides 목록을 확인하세요.`);
    return;
  }
  const C = D.common;
  const slide = (key) => D.slides[AT[key]] || {};
  const PROBLEMS = [slide("q1_show").problem, slide("q2_show").problem]; // 문제 1, 문제 2
  const GRADE = slide("q1_grade");    // ✕ 오답·✓ 정답 글자, 오개념 목록
  const JUDGE = slide("judge");       // 판정 규칙 상자
  const SEARCH = slide("search");     // 그래프·LLM 입력
  const PAGES = slide("g_pages");     // 교과서 쪽
  const FB = slide("feedback");       // 피드백
  const MC = GRADE.misconceptions || {};
  const G = SEARCH.graph;
  const LLM = SEARCH.llmInput || [];

  // 실행 중 상태
  const S = { step: -1, timers: [], net: null, nodes: null, edges: null, edgeIds: null, narrow: null, vw: 0 };

  /* =======================================================================
   * 2. 공통 도구
   * ======================================================================= */
  const CIRCLED = { 1: "①", 2: "②", 3: "③", 4: "④", 5: "⑤", 6: "⑥", 7: "⑦", 8: "⑧", 9: "⑨" };
  const lines = (v) => (Array.isArray(v) ? v : String(v ?? "").split("\n"));
  const confLabel = (v) => (C.confidence.find((c) => String(c.value) === String(v)) || {}).label || "";
  const mcOf = (id) => MC[id] || { name: id, desc: "" };
  const chosenOpt = (p) => p.options.find((o) => o.key === p.answer.key) || {};
  const problemNo = (n) => PROBLEMS[(n || 1) - 1] || PROBLEMS[0];

  // {이름표} 값 모으기 — data.js 맨 위 "[한 곳만 고치면 모든 곳에 반영되는 말]" 표와 같다
  function makeVars() {
    const fromProblem = (prefix, p) => {
      const o = chosenOpt(p);
      const c = p.options.find((x) => x.type === "C") || {};
      Object.assign(V, {
        [`${prefix}.번호`]: p.no,
        [`${prefix}.고른번호`]: CIRCLED[o.key] || o.key || "",
        [`${prefix}.고른답`]: o.text || "",
        [`${prefix}.정답번호`]: CIRCLED[c.key] || c.key || "",
        [`${prefix}.정답`]: c.text || "",
        [`${prefix}.확신도`]: confLabel(p.answer.conf),
        [`${prefix}.오개념`]: o.mc ? mcOf(o.mc).name : "",
        [`${prefix}.문제`]: p.stem,
        [`${prefix}.코드`]: lines(p.code).join("\n"),
      });
    };
    fromProblem("문제1", PROBLEMS[0]);
    fromProblem("문제2", PROBLEMS[1]);
    fromProblem("피드백문제", problemNo(FB.problem || 2));
    const card = mcOf(G.path.card);
    const concept = G.nodes.find((n) => n.id === G.path.concept) || {}; // 정개념 노드
    Object.assign(V, {
      "오개념.이름": card.name || "",
      "오개념.설명": card.desc || "",
      "오개념.믿음확인질문": card.confirmQuestion || "",
      "오개념.실행반례": card.counterExample || "",
      "정개념.이름": concept.title || "",
      "정개념.설명": concept.definition || "",
      교과서쪽: (PAGES.pages || []).map((p) => `${p}쪽`).join(", "),
      판정결과: JUDGE.result || "",
    });
  }
  makeVars();

  // 타이머: 슬라이드를 넘기면 이전 슬라이드에서 걸어 둔 움직임을 모두 취소한다
  function later(fn, ms) {
    S.timers.push(setTimeout(fn, ms));
  }
  function cancelAll() {
    S.timers.forEach(clearTimeout);
    S.timers = [];
    if (S.raf) cancelAnimationFrame(S.raf); // 그래프 색이 바뀌는 중이면 멈춤
    S.raf = 0;
  }
  // 움직임 없이 바로 바꾸기
  function instant(fn) {
    const st = el("demo-stage");
    st.classList.add("noanim");
    fn();
    void st.offsetWidth;
    st.classList.remove("noanim");
  }

  /* =======================================================================
   * 3. 엔트리 블록 그리기 (data.js SLIDE_1·SLIDE_4의 problem.code)
   * ======================================================================= */
  // 한 줄을 칩으로: [이름] → 드롭다운 칩, (값) → 흰 칩, (… 칩 …) → 값 블록. 괄호는 안쪽부터 바꾼다.
  function chipify(text) {
    let s = esc(text)
      .replace(/\(으\)로/g, "⟦EU⟧")
      .replace(/을\(를\)/g, "⟦UL⟧")
      .replace(/\(이\)라면/g, "⟦IF⟧")
      .replace(/\(이\)면/g, "⟦IM⟧");
    s = s.replace(/\[([^\]]+)\]/g, '<span class="chip dd">$1</span>');
    let before;
    do {
      before = s;
      s = s.replace(/\(([^()]+)\)/g, (_, n) =>
        n.includes('class="chip') ? `<span class="chip rep">${n.trim()}</span>` : `<span class="chip${/값|번째/.test(n) ? " dd" : ""}">${n}</span>`
      );
    } while (s !== before);
    return s.replace(/⟦EU⟧/g, "(으)로").replace(/⟦UL⟧/g, "을(를)").replace(/⟦IF⟧/g, "(이)라면").replace(/⟦IM⟧/g, "(이)면");
  }

  // 블록 색 정하기 (줄 안의 낱말로 판단)
  function blockKind(line) {
    const t = line.trim();
    if (t.includes("시작하기")) return "hat";
    if (t.startsWith("함수 정의") || t.startsWith("함수 ")) return "fn";
    if (t.includes("반복") || t.startsWith("만일") || t.startsWith("아니면")) return "ctrl";
    if (t.startsWith("▤") || t.startsWith("◇")) return "decl";
    if (/말하기/.test(t)) return "looks"; // 생김새
    if (/정하기|더하기|삭제|추가|항목/.test(t)) return "var"; // 자료(변수·리스트)
    return "cmd";
  }

  // 블록 끝 동그라미 아이콘 (엔트리: 자료 블록은 ?, 생김새 블록은 꽃 모양)
  const BLOCK_ICON = {
    var: '<span class="blk-ico q">?</span>',
    looks:
      '<span class="blk-ico lk"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="3.5" r="2.4" fill="#fff"/><circle cx="3.4" cy="7.9" r="2.4" fill="#fff"/><circle cx="8.6" cy="7.9" r="2.4" fill="#fff"/></svg></span>',
  };

  function renderBlocks(code) {
    return lines(code)
      .filter((line) => line.trim())
      .map((line) => {
        const kind = blockKind(line);
        const pad = Math.min((line.match(/^\s*/) || [""])[0].length, 16);
        const inner = kind === "hat" ? `<span class="hat-ico"></span>${esc(line.trim())}` : chipify(line.trim()) + (BLOCK_ICON[kind] || "");
        return `<div class="blk ${kind}" style="margin-left:${pad * 7}px">${inner}</div>`;
      })
      .join("");
  }

  /* =======================================================================
   * 4. 문제 카드 (슬라이드 1~8, 15)
   * ======================================================================= */
  function optionsHtml(p, graded) {
    return p.options
      .map((o) => {
        const chosen = o.key === p.answer.key;
        const correct = o.type === "C";
        const cls = ["dopt", chosen && "chosen", correct && "correct", graded && chosen && "on"].filter(Boolean).join(" ");
        let badge = "";
        if (chosen && !correct) badge = `<span class="dbadge wrong">${rich(GRADE.wrongBadge)}</span>`;
        else if (correct) badge = `<span class="dbadge right${chosen ? " mine" : ""}">${rich(GRADE.rightBadge)}</span>`;
        // 채점 때는 정답·오답만 표시한다(어떤 오개념인지는 판정 상자·그래프에서 처음 나온다)
        // .dfold 바로 안쪽 div에는 여백이 없어야 접을 때 높이가 0까지 줄어든다
        return `<div class="dfold${chosen ? " keep" : ""}"><div><div class="${cls}"><span class="dradio"></span><span class="dopt-text">${esc(o.key)}) ${esc(o.text)}</span>${badge}</div></div></div>`;
      })
      .join("");
  }

  function confHtml(p, graded) {
    const opts = C.confidence.map((c) => {
      const chosen = String(c.value) === String(p.answer.conf);
      return `<span class="dconf${chosen ? " chosen" : ""}${graded && chosen ? " on" : ""}"><span class="dradio"></span>${esc(c.label)}</span>`;
    });
    return `<div class="dq-conf"><p class="dq-conf-h">${rich(C.confidenceTitle)}</p><div class="dq-conf-row">${opts.join('<span class="dsep">·</span>')}</div></div>`;
  }

  function questionHtml(p, opt = {}) {
    return `<p class="dq-no">${rich(C.problemLabel, { 번호: p.no })}${opt.mark ? ` · <span class="dq-mark">${rich(opt.mark)}</span>` : ""}</p>
      <div class="dfold"><div>
        <h3 class="dq-stem">${esc(p.stem)}</h3>
        <div class="dq-code blocks">${renderBlocks(p.code)}</div>
      </div></div>
      <div class="dq-opts">${optionsHtml(p, opt.graded)}</div>
      ${confHtml(p, opt.graded)}`;
  }

  // 슬라이드 8 판정 규칙 상자: 두 응답 → 규칙 체크 → 결과
  function buildJudge() {
    const chips = PROBLEMS.map((p) => {
      const o = chosenOpt(p);
      const vars = { 번호: p.no, 확신도: confLabel(p.answer.conf) };
      const html = o.mc
        ? rich(JUDGE.answerChip, { ...vars, 이름: mcOf(o.mc).name })
        : rich(JUDGE.answerChipNoMc, { ...vars, 종류: (JUDGE.answerTypes || {})[o.type] || "" });
      return `<div class="jchip">${html}</div>`;
    });
    let n = 0;
    const order = () => `style="--i:${n++}"`; // 나타나는 순서
    el("demo-judge").innerHTML = `<div class="jrow">
        <div class="jans ji" ${order()}>${chips.join("")}</div>
        <div class="jarrow ji" ${order()}>→</div>
        <div class="jrule ji" ${order()}>
          <p class="jrule-h">${rich(JUDGE.ruleTitle)}</p>
          <p class="jrule-note">${rich(JUDGE.ruleNote)}</p>
          <ul>${(JUDGE.rules || []).map((r) => `<li class="ji" ${order()}><span class="jcheck">✓</span><span>${rich(r)}</span></li>`).join("")}</ul>
        </div>
        <div class="jarrow ji" ${order()}>→</div>
        <div class="jresult ji" ${order()}>${rich(JUDGE.result)}</div>
      </div>`;
  }

  function buildQuiz() {
    el("demo-q0").innerHTML = questionHtml(PROBLEMS[0]);
    el("demo-q1").innerHTML = questionHtml(PROBLEMS[1]);
    buildJudge();
  }

  // 슬라이드 i에서 문제 화면의 모양
  function quizState(i) {
    return {
      q: [
        { show: i >= AT.q1_show, center: i < AT.q2_show, picked: i >= AT.q1_pick, graded: i >= AT.q1_grade, reduced: i >= AT.reduce },
        { show: i >= AT.q2_show, center: false, picked: i >= AT.q2_pick, graded: i >= AT.q2_grade, reduced: i >= AT.reduce },
      ],
      judge: i >= AT.judge,
    };
  }

  function applyQuiz(st, anim) {
    st.q.forEach((s, qi) => {
      const box = el(`demo-q${qi}`);
      box.classList.toggle("show", s.show);
      box.classList.toggle("center", s.center);
      box.classList.toggle("graded", s.graded);
      box.classList.toggle("reduced", s.reduced);
      const opt = box.querySelector(".dopt.chosen");
      const conf = box.querySelector(".dconf.chosen");
      if (anim && s.picked && !opt.classList.contains("on")) {
        // 이번 슬라이드에서 고르는 문제만: 답 → 확신도 순서로 고른다(ms = 고르기까지 걸리는 시간)
        later(() => opt.classList.add("on"), 30);
        later(() => conf.classList.add("on"), 500);
      } else {
        opt.classList.toggle("on", s.picked);
        conf.classList.toggle("on", s.picked);
      }
    });
    el("demo-judge").classList.toggle("on", st.judge);
  }

  /* =======================================================================
   * 5. 그래프 (슬라이드 9~13) — data.js SLIDE_9.graph
   * ======================================================================= */
  // 노드 종류별 색 — 바탕(bg)·테두리(border). 보내 준 '그래프RAG 탐색' 그림과 같은 색
  const KIND = {
    option: { bg: "#f5f5f5", border: "#666666" },   // 학생이 고른 선지: 회색
    card: { bg: "#f8cecc", border: "#b85450" },     // 오개념: 빨강
    concept: { bg: "#dae8fc", border: "#6c8ebf" },  // 정개념: 파랑
    resource: { bg: "#d5e8d4", border: "#82b366" }, // 학습 자료: 초록
  };
  const RADIUS = { option: 40, card: 50, concept: 48, resource: 42 }; // 찾아가는 노드(큰 원) 반지름
  const FAINT_R = 15; // 주변 노드(작은 원) 반지름
  const NARROW_GRAPH = 640; // 그래프 칸이 이보다 좁으면(휴대폰) 위→아래로 놓고 주변 노드는 숨긴다
  const FACE = "Pretendard, sans-serif";
  // 원 아래 이름 글자. background: 글자 뒤 바탕(선이 글자 위로 지나가 보이지 않게)
  const LABEL_BG = "rgba(252, 252, 253, 0.92)";
  const capFont = (color, size) => ({ size, face: FACE, color, vadjust: 4, background: LABEL_BG });

  const onPath = (id) => {
    const p = G.path;
    return p.options.includes(id) || id === p.card || id === p.concept || p.resources.includes(id);
  };

  // 원 안 글자 (찾아가는 노드만): data.js SLIDE_9.nodeText
  function innerText(n) {
    if (!onPath(n.id)) return "";
    const T = SEARCH.nodeText || {};
    if (n.kind === "option") {
      const p = problemNo(n.problem);
      const o = chosenOpt(p);
      return plain(T.option ?? "문제{번호}\n{선지}", { 번호: p.no, 선지: CIRCLED[o.key] || o.key });
    }
    return plain(T[n.kind] ?? "");
  }

  // 원 아래 이름: 오개념 이름 · 교과서 쪽 · 그 밖은 title
  function caption(n) {
    if (n.kind === "card") return mcOf(n.id).name || "";
    if (n.kind === "resource" && !n.title) {
      const pg = (PAGES.pages || [])[G.path.resources.indexOf(n.id)];
      return pg != null ? plain(FB.pageText || "{쪽}쪽", { 쪽: pg }) : "";
    }
    return plain(n.title || "");
  }

  // 노드 모양 (size = 반지름, ink = 원 안 글자 색)
  //   faint: 주변 노드(작고 아주 연하게) · dim: 찾아가는 노드인데 아직(회색)
  //   lit: 지금 찾음(진한 테두리, 조금 큼) · done: 지나옴(종류 색)
  function nodeStyle(n, st) {
    if (st === "faint") {
      return { size: FAINT_R, color: { background: "#ffffff", border: "#e1e4e8" }, borderWidth: 1.5, font: capFont("#c4c8ce", 14), ink: "#ffffff", shadow: false };
    }
    const c = KIND[n.kind] || KIND.concept;
    const r = RADIUS[n.kind] || 44;
    if (st === "dim") {
      return { size: r, color: { background: "#f4f4f5", border: "#d4d4d8" }, borderWidth: 1.5, font: capFont("#b4b4bb", 16), ink: "#a1a1aa", shadow: false };
    }
    const lit = st === "lit";
    return {
      size: lit ? r * 1.08 : r,
      color: { background: c.bg, border: c.border },
      borderWidth: lit ? 3.5 : 2,
      font: capFont("#27272a", 16),
      ink: "#111111",
      shadow: false,
    };
  }
  // 슬라이드 상태(st)에서 노드 하나의 모양 이름
  const nodeSt = (n, st) => (onPath(n.id) ? st.nodes[n.id] || "dim" : "faint");

  // 선 모양 (글자 없음): faint 주변 선 · dim 찾아갈 길(아직) · lit 지금 따라가는 길 · done 지나온 길
  function edgeStyle(st) {
    if (st === "lit") return { color: { color: "#f59e0b" }, width: 3 };
    if (st === "done") return { color: { color: "#3f3f46" }, width: 1.8 };
    if (st === "dim") return { color: { color: "#d9dbe0" }, width: 1.5 };
    return { color: { color: "#eceef1" }, width: 1.2 };
  }
  const edgeSt = (id, st) => st.edges[id] || (S.pathEdges.has(id) ? "dim" : "faint");

  // 노드 위치
  //   넓은 화면(보내 준 그림 배치): 선지 두 개는 왼쪽 위·아래 → 오개념 → 정개념 → 학습 자료는 오른쪽 위
  //             주변 노드는 data.js의 x, y (없으면 빈자리)
  //   좁은 화면: 위부터 선지 → 오개념 → 정개념 → 학습 자료, 주변 노드는 숨김
  function positions(narrow) {
    const p = G.path;
    const pos = {};
    const spread = (ids, gap, put) => ids.forEach((id, i) => (pos[id] = put((i - (ids.length - 1) / 2) * gap, i)));
    if (narrow) {
      spread(p.options, 200, (x) => ({ x, y: -400 }));
      pos[p.card] = { x: 0, y: -185 };
      pos[p.concept] = { x: 0, y: 45 };
      spread(p.resources, 200, (x) => ({ x, y: 265 }));
      G.nodes.forEach((n) => (pos[n.id] = pos[n.id] || { x: 0, y: 0 }));
      return pos;
    }
    spread(p.options, 240, (y) => ({ x: -350, y: y + 10 }));
    pos[p.card] = { x: -110, y: 20 };
    pos[p.concept] = { x: 140, y: 20 };
    spread(p.resources, 160, (x) => ({ x: 320 + x, y: -150 }));
    const slots = [[0, -230], [0, 250], [-200, -220], [300, 230], [-200, 250], [380, 60]];
    let k = 0;
    G.nodes.forEach((n) => {
      if (n.x != null && n.y != null) pos[n.id] = { x: n.x, y: n.y };
      else if (!pos[n.id]) {
        const [x, y] = slots[k++ % slots.length];
        pos[n.id] = { x, y };
      }
    });
    return pos;
  }

  // 슬라이드 i에서 찾아가는 노드·선 상태
  function graphState(i) {
    const p = G.path;
    const nodes = {};
    const edges = {};
    const set = (obj, ids, lit) => ids.forEach((id) => (obj[id] = lit ? "lit" : "done"));
    if (i >= AT.g_options) set(nodes, p.options, i === AT.g_options);
    if (i >= AT.g_card) {
      set(nodes, [p.card], i === AT.g_card);
      set(edges, S.edgeIds.opt, i === AT.g_card);
    }
    if (i >= AT.g_concept) {
      set(nodes, [p.concept], i === AT.g_concept);
      set(edges, S.edgeIds.card, i === AT.g_concept);
    }
    if (i >= AT.g_pages) {
      set(nodes, p.resources, i === AT.g_pages);
      set(edges, S.edgeIds.res, i === AT.g_pages);
    }
    return { nodes, edges };
  }

  // 범례: data.js SLIDE_9.legend가 있을 때만 (지금은 원 안 글자로 종류를 보여 주므로 쓰지 않음)
  function buildLegend() {
    const L = SEARCH.legend;
    el("demo-legend").hidden = !L;
    if (!L) return;
    el("demo-legend").innerHTML =
      Object.entries(KIND)
        .map(([k, c]) => `<span><i style="background:${c.border}"></i>${rich(L[k] || k)}</span>`)
        .join("") + `<span><i class="trail"></i>${rich(L.trail || "")}</span>`;
  }

  // 원 안 글자는 vis가 그리지 않으므로, 그래프를 그릴 때마다 그 위에 직접 쓴다
  function drawInner(ctx) {
    const pos = S.net.getPositions();
    S.nodes.get({ filter: (n) => n.inner && !n.hidden }).forEach((n) => {
      const p = pos[n.id];
      const rows = n.inner.split("\n");
      const lh = n.innerSize * 1.2;
      ctx.save();
      ctx.font = `700 ${n.innerSize}px ${FACE}`;
      ctx.fillStyle = n.ink;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      rows.forEach((row, k) => ctx.fillText(row, p.x, p.y + (k - (rows.length - 1) / 2) * lh));
      ctx.restore();
    });
  }

  // 화면을 그래프 전체에 맞추고 가장자리에 여백을 조금 둔다
  function fitView() {
    S.net.fit({ animation: false });
    S.net.moveTo({ scale: S.net.getScale() * 0.92, animation: false });
  }

  function buildGraph(narrow) {
    const p = G.path;
    const pos = positions(narrow);
    S.narrow = narrow;
    S.nodes = new vis.DataSet(
      G.nodes.map((n) => {
        const cap = caption(n);
        return {
          id: n.id,
          label: cap || undefined,
          inner: innerText(n),
          innerSize: n.kind === "option" ? 17 : 20,
          x: pos[n.id].x,
          y: pos[n.id].y,
          hidden: narrow && !onPath(n.id),
          fixed: true,
          shape: "dot", // 원 (이름은 원 아래, 원 안 글자는 drawInner)
          widthConstraint: { maximum: 170 },
          ...nodeStyle(n, onPath(n.id) ? "dim" : "faint"),
        };
      })
    );
    S.edgeIds = { opt: [], card: [], res: [] }; // 찾아가는 길 위의 선
    S.pathEdges = new Set();
    S.edges = new vis.DataSet(
      G.edges.map((e, i) => {
        const id = `de${i}`;
        if (p.options.includes(e.from) && e.to === p.card) S.edgeIds.opt.push(id);
        if (e.from === p.card && e.to === p.concept) S.edgeIds.card.push(id);
        if (e.from === p.concept && p.resources.includes(e.to)) S.edgeIds.res.push(id);
        const onTrail = S.edgeIds.opt.includes(id) || S.edgeIds.card.includes(id) || S.edgeIds.res.includes(id);
        if (onTrail) S.pathEdges.add(id);
        return {
          id,
          from: e.from,
          to: e.to,
          label: e.label || undefined,
          arrows: { to: { enabled: true, scaleFactor: 0.6 } },
          smooth: false,
          font: { size: 14, face: FACE, color: "#9ca3af", strokeWidth: 3, strokeColor: "#fff" },
          ...edgeStyle(onTrail ? "dim" : "faint"),
        };
      })
    );
    S.net = new vis.Network(
      el("demo-graph"),
      { nodes: S.nodes, edges: S.edges },
      {
        physics: { enabled: false },
        layout: { improvedLayout: false },
        interaction: { dragNodes: false, dragView: false, zoomView: false, selectable: false, hover: false },
      }
    );
    S.net.on("afterDrawing", drawInner);
    fitView();
  }

  // 그래프를 칸 크기에 맞춘다. 넓은↔좁은 배치가 바뀌면 새로 그린다. (그래프 칸이 보일 때만)
  function syncGraph(refit) {
    const box = el("demo-graph");
    if (!box.offsetWidth) return false;
    if (!window.vis) {
      showError("그래프 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침(F5)하세요.");
      return false;
    }
    const narrow = box.clientWidth < NARROW_GRAPH;
    if (S.net && narrow !== S.narrow) {
      S.net.destroy();
      S.net = null;
    }
    if (!S.net) buildGraph(narrow);
    else if (refit) {
      S.net.setSize("100%", "100%");
      fitView();
    }
    return true;
  }

  function paintGraph(i) {
    const st = graphState(i);
    S.nodes.update(G.nodes.map((n) => ({ id: n.id, ...nodeStyle(n, nodeSt(n, st)) })));
    S.edges.update(S.edges.getIds().map((id) => ({ id, ...edgeStyle(edgeSt(id, st)) })));
  }

  // ----- 그래프 색이 서서히 바뀌는 움직임 -----
  // 색 글자(#rgb, #rrggbb, rgba(...))를 [r, g, b, a]로
  function rgba(c) {
    const s = String(c || "").trim();
    if (s[0] === "#") {
      const h = s.length === 4 ? [...s.slice(1)].map((x) => x + x).join("") : s.slice(1);
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1];
    }
    const m = s.match(/[\d.]+/g) || [0, 0, 0, 0];
    return [+m[0], +m[1], +m[2], m[3] == null ? 1 : +m[3]];
  }
  const mixNum = (a, b, t) => a + (b - a) * t;
  function mixColor(a, b, t) {
    const x = rgba(a);
    const y = rgba(b);
    return `rgba(${[0, 1, 2].map((k) => Math.round(mixNum(x[k], y[k], t))).join(", ")}, ${mixNum(x[3], y[3], t).toFixed(3)})`;
  }
  function mixNode(n, sa, sb, t) {
    const A = nodeStyle(n, sa);
    const B = nodeStyle(n, sb);
    return {
      size: mixNum(A.size, B.size, t),
      borderWidth: mixNum(A.borderWidth, B.borderWidth, t),
      color: { background: mixColor(A.color.background, B.color.background, t), border: mixColor(A.color.border, B.color.border, t) },
      font: { ...B.font, color: mixColor(A.font.color, B.font.color, t) },
      ink: mixColor(A.ink, B.ink, t),
      shadow: false,
    };
  }
  function mixEdge(sa, sb, t) {
    const A = edgeStyle(sa);
    const B = edgeStyle(sb);
    return { color: { color: mixColor(A.color.color, B.color.color, t) }, width: mixNum(A.width, B.width, t) };
  }
  // 슬라이드 from의 그래프 모양에서 to의 모양으로 ms 동안 서서히 바꾼다 (바뀌는 노드·선만)
  function tweenGraph(from, to, ms = 550) {
    const a = graphState(from);
    const b = graphState(to);
    const nodes = G.nodes.filter((n) => nodeSt(n, a) !== nodeSt(n, b));
    const edges = S.edges.getIds().filter((id) => edgeSt(id, a) !== edgeSt(id, b));
    let t0 = null; // 첫 프레임 시각부터 잰다
    const frame = (now) => {
      if (t0 === null) t0 = now;
      const p = Math.max(0, Math.min(1, (now - t0) / ms)); // 진행률 0~1
      const t = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // 천천히-빠르게-천천히
      S.nodes.update(nodes.map((n) => ({ id: n.id, ...mixNode(n, nodeSt(n, a), nodeSt(n, b), t) })));
      S.edges.update(edges.map((id) => ({ id, ...mixEdge(edgeSt(id, a), edgeSt(id, b), t) })));
      S.raf = p < 1 ? requestAnimationFrame(frame) : 0;
    };
    S.raf = requestAnimationFrame(frame);
  }

  /* =======================================================================
   * 6. LLM 입력 상자 (슬라이드 9~14) — data.js SLIDE_9.llmInput, SLIDE_13.pages
   * ======================================================================= */
  // 칸이 채워지는 슬라이드: 문항(item) 9 · 오개념(card) 11 · 정개념(concept) 12
  const FILL_AT = () => ({ item: AT.search, card: AT.g_card, concept: AT.g_concept });

  function buildLlm() {
    el("t-graph").innerHTML = rich(SEARCH.graphTitle);
    el("t-llm").innerHTML = rich(SEARCH.llmTitle);
    el("t-direct").innerHTML = rich(SEARCH.directTitle);
    el("demo-llm").innerHTML =
      LLM.map((r, i) => `<div class="jl" data-i="${i}"><span class="jk">${rich(r.label)}</span><span class="jv empty">▢</span></div>`).join("") +
      `<p class="demo-sent">${rich(slide("send").sentLabel)}</p>`;
    el("demo-direct").innerHTML = "";
  }

  const lineEl = (i) => el("demo-llm").querySelector(`.jl[data-i="${i}"]`);
  // LLM 입력 칸 값 ({이름표}를 채운 뒤의 글자)
  const llmValue = (i) => lines(LLM[i].value).map((l) => plain(l)).join("\n");

  // 칸 하나: filled = 채움, isNew = 이번 슬라이드에서 새로 채워짐(옅은 노란 바탕)
  function setLine(i, filled, isNew) {
    const line = lineEl(i);
    if (!line) return;
    const v = line.querySelector(".jv");
    v.textContent = llmValue(i); // 빈칸일 때도 글자는 넣어 두고 숨긴다(채워질 때 상자 높이가 바뀌지 않게)
    v.classList.toggle("empty", !filled);
    line.classList.toggle("new", filled && isNew);
  }

  // 교과서 쪽 칸: filled = 붙음, isNew = 이번 슬라이드에서 붙음(LLM 입력 칸처럼 옅은 노란 바탕)
  function setPages(filled, isNew) {
    const cls = `demo-page${isNew ? " new" : ""}`;
    el("demo-direct").innerHTML = filled ? (PAGES.pages || []).map((p) => `<span class="${cls}">${rich(PAGES.pageChip, { 쪽: p })}</span>`).join("") : "";
  }

  // 나타나기: .enter(숨김)를 붙여 한 번 그린 뒤 떼면 CSS transition으로 스르륵 나타난다
  function reveal(node) {
    if (!node) return;
    node.classList.add("enter");
    void node.offsetWidth;
    node.classList.remove("enter");
  }

  // 슬라이드 i에서 그래프와 LLM 입력 상자 모양
  //   anim(넘겨 왔을 때) 순서: ① 지난 슬라이드의 노란 바탕이 지워짐(0.35초)
  //                            ② 그래프 색이 서서히 바뀜(0.55초)
  //                            ③ 새로 채워지는 칸·교과서 쪽이 노란 바탕으로 한꺼번에 나타남 (+ LLM으로 보냄)
  //   지울 노란 바탕이 없으면 ①을 건너뛰고 바로 ②부터.
  function applySearch(i, anim) {
    const tween = anim && i > AT.search;
    const fillAt = FILL_AT();
    const atOf = (r) => fillAt[r.from] ?? AT.search;
    const hadOld = tween && (LLM.some((r) => atOf(r) === i - 1) || i - 1 === AT.g_pages);
    const graphAt = hadOld ? 350 : 0; // ② 그래프가 바뀌기 시작하는 때(ms)
    const after = tween ? graphAt + 650 : 250; // ③ 새 노란 바탕이 나타나는 때(ms)
    if (tween) {
      paintGraph(i - 1); // 이전 슬라이드 모양에서 시작
      later(() => tweenGraph(i - 1, i), graphAt);
    } else {
      paintGraph(i);
    }
    LLM.forEach((r, idx) => {
      const at = atOf(r);
      if (anim && i === at) {
        // 이번에 채울 칸: 그때까지 빈칸(▢) 그대로 → ③에서 채우며 노란 바탕
        setLine(idx, false, false);
        later(() => {
          setLine(idx, true, true);
          reveal(lineEl(idx));
        }, after);
      } else {
        // 그 밖의 칸 (지난 슬라이드에 채운 칸은 여기서 노란 바탕이 빠지며 ①처럼 흐려진다)
        setLine(idx, i >= at, i === at);
      }
    });
    // LLM으로 보냄 (슬라이드 14)
    const llmBox = el("demo-llm");
    if (anim && i === AT.send) {
      llmBox.classList.remove("sent");
      later(() => llmBox.classList.add("sent"), after);
    } else {
      llmBox.classList.toggle("sent", i >= AT.send);
    }
    // 교과서 쪽 (슬라이드 13에 붙음)
    const chips = () => el("demo-direct").querySelectorAll(".demo-page");
    if (anim && i === AT.g_pages) {
      setPages(false);
      later(() => {
        setPages(true, true);
        chips().forEach(reveal);
      }, after);
    } else if (anim && i - 1 === AT.g_pages && chips().length) {
      chips().forEach((c) => c.classList.remove("new")); // ① 지난 슬라이드의 노란 바탕 지움
    } else {
      setPages(i >= AT.g_pages, i === AT.g_pages);
    }
  }

  /* =======================================================================
   * 7. 피드백 (슬라이드 15) — data.js SLIDE_15
   * ======================================================================= */
  // 피드백: 문제 카드 안 회색 상자에 문단 → 교과서 쪽 줄 순서로 차례로 나타난다(간격은 CSS .fb-para)
  //   data.js에 text(한 문단)가 있으면 그것을, paragraphs(소제목 문단들)가 있으면 그것을 쓴다.
  //   문단이 여러 개면 마지막 문단은 옅은 초록 상자. Backspace로 돌아왔을 때는 바로 다 보인다.
  function renderFeedback(anim) {
    const p = problemNo(FB.problem || 2);
    const paras = (FB.paragraphs || (FB.text ? [FB.text] : [])).map((pa) => (typeof pa === "string" ? { label: "", text: pa } : pa));
    const last = paras.length - 1;
    const pages = (PAGES.pages || []).map((pg) => rich(FB.pageText, { 쪽: pg })).join(esc(FB.pageJoin ?? " · "));
    // 피드백 회색 상자는 문제 카드 안, 선지·확신도 바로 아래에 둔다
    el("demo-fb").innerHTML = `<div class="fb-cols">
        <article class="dq show graded fb-q">${questionHtml(p, { graded: true, mark: FB.mark })}
          <section class="fb-box">
            <p class="fb-h">${rich(FB.panelTitle)}</p>
            <div class="fb-body">
              ${paras
                .map(
                  (pa, i) => `<div class="fb-para${i === last && paras.length > 1 ? " key" : ""}" style="--i:${i}">
                    ${pa.label ? `<p class="fb-label"><span class="n">${i + 1}</span>${rich(pa.label)}</p>` : ""}
                    <p class="fb-text">${rich(pa.text)}</p>
                  </div>`
                )
                .join("")}
              <p class="fb-pages" style="--i:${paras.length}"><span>${rich(FB.pagesLabel)}</span>${pages}</p>
            </div>
          </section>
        </article>
      </div>`;
    const body = el("demo-fb").querySelector(".fb-body");
    if (anim) {
      void body.offsetWidth; // 숨긴 상태를 먼저 그린 뒤
      body.classList.add("on"); // 차례로 나타나게
    } else {
      instant(() => body.classList.add("on"));
    }
  }

  /* =======================================================================
   * 8. 휴대폰(좁은 화면): 슬라이드마다 볼 곳으로 화면을 옮긴다
   *    [보여 줄 곳, 몇 ms 뒤에, 맞출 위치(start = 위에 맞춤, 없으면 가장 가까운 쪽)]
   *    "top" = 페이지 맨 위. 컴퓨터처럼 넓은 화면에서는 움직이지 않는다.
   * ======================================================================= */
  const SMALL = window.matchMedia("(max-width: 900px)");
  const FOCUS = {
    q1_show: [["top", 0]],
    q1_pick: [["#demo-q0 .dq-conf", 0]],
    q1_grade: [["#demo-q0 .dopt.chosen", 0]],
    q2_show: [["#demo-q1", 0, "start"]],
    q2_pick: [["#demo-q1 .dq-conf", 0]],
    q2_grade: [["#demo-q1 .dopt.chosen", 0]],
    reduce: [["top", 0]],
    judge: [["#demo-judge", 200]],
    search: [["top", 0], ["#demo-llm", 700]],
    g_options: [["#demo-graph", 0]],
    g_card: [["#demo-graph", 0], ["#demo-llm", 900]],
    g_concept: [["#demo-graph", 0], ["#demo-llm", 900]],
    g_pages: [["#demo-graph", 0], ["#demo-direct", 900]],
    send: [["#demo-llm", 0]],
    feedback: [["#demo-fb .fb-box", 0]],
  };

  function focusStep(i, anim) {
    if (!SMALL.matches) return;
    // 아래에 고정된 설명 칸에 가리지 않게 여백을 둔다
    document.documentElement.style.scrollPaddingBottom = `${el("demo-explain").offsetHeight + 12}px`;
    document.documentElement.style.scrollPaddingTop = "8px";
    const plan = FOCUS[STEPS[i].key] || [];
    const go = ([sel, , block], behavior) => {
      if (sel === "top") return window.scrollTo({ top: 0, behavior });
      const t = document.querySelector(sel);
      if (t) t.scrollIntoView({ block: block || "nearest", behavior });
    };
    if (!anim) {
      if (plan.length) go(plan[plan.length - 1], "auto");
      return;
    }
    plan.forEach((f) => (f[1] ? later(() => go(f, "smooth"), f[1]) : go(f, "smooth")));
  }

  /* =======================================================================
   * 9. 슬라이드 이동
   * ======================================================================= */
  function render(i, anim) {
    cancelAll();
    const phase = STEPS[i].phase;
    const wasSearch = S.step >= 0 && STEPS[S.step].phase === "search";
    el("demo-quiz").hidden = phase !== "quiz";
    el("demo-search").hidden = phase !== "search";
    el("demo-fb").hidden = phase !== "fb";
    S.step = i;
    el("demo-progress").textContent = `${i + 1} / ${STEPS.length}`;
    el("demo-text").innerHTML = rich(D.slides[i].narration);
    el("demo-prev").disabled = i === 0;
    el("demo-next").disabled = i === STEPS.length - 1;
    if (phase === "quiz") {
      if (anim) {
        instant(() => applyQuiz(quizState(i - 1), false));
        applyQuiz(quizState(i), true);
      } else {
        instant(() => applyQuiz(quizState(i), false));
      }
    } else if (phase === "search") {
      if (!syncGraph(!wasSearch)) return;
      if (anim) applySearch(i, true);
      else instant(() => applySearch(i, false));
    } else {
      renderFeedback(anim);
    }
    focusStep(i, anim);
  }

  const next = () => S.step >= 0 && S.step < STEPS.length - 1 && render(S.step + 1, true);
  const prev = () => S.step > 0 && render(S.step - 1, false);

  // 주소 끝에 ?step=9 를 붙이면 슬라이드 9부터 연다
  function startStep() {
    const m = /[?&#]step=(\d+)/.exec(location.search + location.hash);
    const n = m ? parseInt(m[1], 10) : 1;
    return Math.min(Math.max(n, 1), STEPS.length) - 1;
  }

  function openDemo() {
    document.title = plain(C.title);
    el("page-title").innerHTML = rich(C.title);
    el("hint-keys").innerHTML = rich(C.keysHint);
    el("hint-tap").innerHTML = rich(C.tapHint);
    el("demo-prev").innerHTML = rich(C.prevButton);
    el("demo-next").innerHTML = rich(C.nextButton);
    buildQuiz();
    buildLlm();
    buildLegend();
    instant(() => applyQuiz(quizState(-1), false));
    const s = startStep();
    render(s, s === 0);
  }

  // 키보드: Enter · → · PageDown 다음 / Backspace · ← · PageUp 이전 (발표용 리모컨도 됨)
  document.addEventListener("keydown", (e) => {
    if (S.step < 0) return;
    if (["Enter", "ArrowRight", "PageDown"].includes(e.key)) {
      e.preventDefault();
      next();
    } else if (["Backspace", "ArrowLeft", "PageUp"].includes(e.key)) {
      e.preventDefault();
      prev();
    }
  });

  // 클릭·탭: 화면 어디를 눌러도 다음 (버튼은 각자 동작)
  document.addEventListener("click", (e) => {
    if (e.target.closest("button, a, input, textarea, select")) return;
    next();
  });
  el("demo-prev").addEventListener("click", (e) => {
    e.currentTarget.blur();
    prev();
  });
  el("demo-next").addEventListener("click", (e) => {
    e.currentTarget.blur();
    next();
  });

  // 창 너비가 바뀌면(휴대폰 회전 등) 그래프를 다시 맞춘다. 높이만 바뀌는 것(휴대폰 주소창)은 무시
  window.addEventListener("resize", () => {
    if (window.innerWidth === S.vw) return;
    S.vw = window.innerWidth;
    if (S.step >= 0 && STEPS[S.step].phase === "search" && syncGraph(true)) paintGraph(S.step);
  });

  try {
    S.vw = window.innerWidth;
    openDemo();
  } catch (err) {
    console.error(err);
    showError(`화면을 그리다 멈췄습니다: ${err.message} — data.js에서 방금 고친 곳의 이름표·괄호를 확인하세요.`);
  }
})();
  </script>
</body>
